version: 2
semantic_models:
- name: orders
  description: 'Semantic model for orders. Task: Give me the sales numbers.'
  model: ref('orders')
  entities:
  - name: order
    type: primary
    expr: order_id
  - name: customer
    type: foreign
    expr: customer_id
  measures:
  - name: amount
    agg: sum
    expr: amount
  dimensions:
  - name: ds
    type: time
    expr: cast('2018-01-01' as date)
    type_params:
      time_granularity: day
  defaults:
    agg_time_dimension: ds
